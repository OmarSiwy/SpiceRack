[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "spicerack"
version = "0.1.0"
description = "Build SPICE circuits, generate netlists, run simulator backends, and read results"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/OmarSiwy/SpiceRack"

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["python"]
module-name = "spicerack._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
