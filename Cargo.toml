[package]
name = "spicerack"
version = "0.1.0"
edition = "2024"
description = "Build SPICE circuits, generate netlists, run simulator backends, and read results"
repository = "https://github.com/OmarSiwy/SpiceRack"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["spice", "simulation", "circuit", "netlist", "eda"]
categories = ["science", "simulation"]

[lib]
name = "spicerack"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
num-complex = "0.4"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
pretty_assertions = "1"

[features]
default = ["python"]
python = ["dep:pyo3"]
